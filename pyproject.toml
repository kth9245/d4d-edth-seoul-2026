[project]
name = "d4d-edth-seoul-2026"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["knowledge/spikes", "modules/cop-ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests", "modules"]
pythonpath = ["."]
norecursedirs = ["node_modules", "dist", ".venv", "knowledge"]
addopts = "-q -n auto"  # decision 0021: parallel by default; `-n 0` for one-test debugging
markers = ["slow: ship.sh skips it; run with `uv run pytest -m slow` (decision 0056)"]
